<!-- Header Section -->
<div class="fixed top-0 left-1/2 -translate-x-1/2 w-full max-w-[480px] z-50 transition-all duration-300">
    <div class="bg-white/80 dark:bg-obsidian-950/80 backdrop-blur-xl px-6 pt-6 pb-20 border-b border-gray-100/50 dark:border-obsidian-800/50">
        <div class="flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div
                    class="w-10 h-10 bg-white dark:bg-obsidian-800 rounded-2xl flex items-center justify-center shadow-sm border border-gray-100 dark:border-obsidian-700">
                    <i class="bi bi-wallet2 text-emerald-600 dark:text-emerald-400 text-lg"></i>
                </div>
                <div>
                    <h1 class="text-xl font-black text-gray-900 dark:text-obsidian-100 tracking-tight leading-tight">Simpanan</h1>
                    <p class="text-[10px] text-gray-500 dark:text-obsidian-500 font-medium uppercase tracking-wider">Produk & Saldo Dana</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="Portal.togglePrivacy()" 
                    class="w-9 h-9 rounded-full bg-gray-50 dark:bg-obsidian-800 flex items-center justify-center text-gray-400 hover:text-gray-600 dark:hover:text-obsidian-200 transition-all active:scale-90">
                    <i class="privacy-toggle-icon bi bi-eye-fill"></i>
                </button>
                <button onclick="Portal.tab('home')"
                    class="w-9 h-9 rounded-full bg-gray-50 dark:bg-obsidian-800 flex items-center justify-center text-gray-400 hover:text-gray-600 dark:hover:text-obsidian-200 transition-colors">
                    <i class="bi bi-house-fill text-sm"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Floating Summary Card -->
    <div class="px-6 -mt-16 relative z-10">
        <div
            class="bg-gradient-to-br from-emerald-500 via-teal-600 to-cyan-700 rounded-[2.5rem] p-7 text-white shadow-xl shadow-emerald-500/20 overflow-hidden relative">
            <!-- Premium Glass Ornaments -->
            <div
                class="absolute top-0 right-0 -mt-6 -mr-6 w-32 h-32 bg-white rounded-full mix-blend-overlay opacity-20 blur-2xl">
            </div>
            <div
                class="absolute bottom-0 left-0 -mb-6 -ml-6 w-24 h-24 bg-teal-300 rounded-full mix-blend-overlay opacity-20 blur-xl">
            </div>

            <div class="relative z-10">
                <p class="text-[10px] font-bold text-emerald-100 uppercase tracking-[0.2em] mb-1 opacity-80">Total Saldo
                    Terkumpul</p>
                <h2 class="text-3xl font-black tracking-tight drop-shadow-sm" id="simp-total-saldo">Rp —</h2>

                <div class="flex items-center justify-between mt-6 pt-5 border-t border-white/10">
                    <div>
                        <p class="text-[9px] text-emerald-100 uppercase tracking-widest mb-0.5 opacity-70">Produk Aktif
                        </p>
                        <p class="text-xs font-bold" id="simp-produk-count">— Produk</p>
                    </div>
                    <div class="text-right">
                        <p class="text-[9px] text-emerald-100 uppercase tracking-widest mb-0.5 opacity-70">Update</p>
                        <p class="text-[10px] font-medium opacity-90" id="simp-update-time">—</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Spacer for fixed header -->
<div class="h-[265px]"></div>

<!-- Produk Simpanan (container) -->
<div class="px-6 space-y-3 mt-4" id="p-content-simpanan"></div>

<!-- Mutasi Modal (bottom sheet) -->
<div id="simp-mutasi-modal" class="modal-sheet-wrapper fixed inset-0 z-50 flex flex-col">
    <div class="modal-sheet-overlay absolute inset-0 bg-black/40 backdrop-blur-sm"
        onclick="Portal.closeModal('simp-mutasi-modal')"></div>
    <div class="flex-1 pointer-events-none"></div>
    <div
        class="modal-sheet-panel bg-white dark:bg-obsidian-900 rounded-t-[2.5rem] max-h-[90vh] flex flex-col max-w-[480px] mx-auto w-full shadow-2xl relative transition-all duration-300">
        <!-- Drag Indicator -->
        <div class="absolute top-3 left-1/2 -translate-x-1/2 w-10 h-1.5 bg-gray-200 dark:bg-obsidian-800 rounded-full z-10"></div>
        
        <div
            class="px-6 pt-8 pb-4 border-b border-gray-100 dark:border-obsidian-800 flex items-center justify-between sticky top-0 bg-white dark:bg-obsidian-900 rounded-t-[2.5rem] z-10">
            <div>
                <p id="simp-mut-judul" class="font-black text-gray-900 dark:text-obsidian-100 text-lg tracking-tight"></p>
                <p id="simp-mut-saldo" class="text-sm text-emerald-600 dark:text-emerald-400 font-bold mt-0.5 tracking-tight"></p>
            </div>
            <button onclick="Portal.closeModal('simp-mutasi-modal')"
                class="w-10 h-10 rounded-2xl bg-gray-50 dark:bg-obsidian-800 flex items-center justify-center text-gray-400 dark:text-obsidian-500 hover:bg-gray-100 dark:hover:bg-obsidian-700 transition-all active:scale-90">
                <i class="bi bi-x-lg text-sm"></i>
            </button>
        </div>

        <!-- Filter Bar -->
        <div class="px-6 py-4 bg-gray-50/50 dark:bg-obsidian-800/30 border-b border-gray-100 dark:border-obsidian-800 flex gap-3">
            <div class="flex-1 relative">
                <select id="simp-mut-bulan" class="w-full bg-white dark:bg-obsidian-800 border-none rounded-2xl text-[11px] font-black uppercase tracking-widest py-3 pl-4 pr-10 appearance-none focus:ring-2 focus:ring-emerald-500 shadow-sm dark:text-obsidian-200">
                    <option value="all">Semua Bulan</option>
                    <option value="1">Januari</option>
                    <option value="2">Februari</option>
                    <option value="3">Maret</option>
                    <option value="4">April</option>
                    <option value="5">Mei</option>
                    <option value="6">Juni</option>
                    <option value="7">Juli</option>
                    <option value="8">Agustus</option>
                    <option value="9">September</option>
                    <option value="10">Oktober</option>
                    <option value="11">November</option>
                    <option value="12">Desember</option>
                </select>
                <i class="bi bi-chevron-down absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none text-[10px]"></i>
            </div>
            <div class="w-32 relative">
                <select id="simp-mut-tahun" class="w-full bg-white dark:bg-obsidian-800 border-none rounded-2xl text-[11px] font-black uppercase tracking-widest py-3 pl-4 pr-10 appearance-none focus:ring-2 focus:ring-emerald-500 shadow-sm dark:text-obsidian-200">
                    <!-- Years populated by JS -->
                </select>
                <i class="bi bi-calendar4-event absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none text-[10px]"></i>
            </div>
        </div>

        <div id="simp-mut-list" class="overflow-y-auto px-6 py-4 space-y-3 flex-1 custom-scrollbar">
            <div class="text-center text-gray-400 text-sm py-12"><i
                    class="bi bi-hourglass-split animate-pulse text-3xl block mb-3 text-emerald-500/30"></i>
                <p class="text-[10px] font-black uppercase tracking-widest text-gray-400">Menyusun Mutasi...</p>
            </div>
        </div>
    </div>
</div>
