<!-- Header Section -->
<div class="fixed top-0 left-1/2 -translate-x-1/2 w-full max-w-[480px] z-50 transition-all duration-300">
    <div class="bg-white/80 backdrop-blur-xl px-6 pt-6 pb-20 border-b border-gray-100/50">
        <div class="flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div
                    class="w-10 h-10 bg-white rounded-2xl flex items-center justify-center shadow-sm border border-gray-100">
                    <i class="bi bi-wallet2 text-emerald-600 text-lg"></i>
                </div>
                <div>
                    <h1 class="text-xl font-black text-gray-900 tracking-tight leading-tight">Simpanan</h1>
                    <p class="text-[10px] text-gray-500 font-medium uppercase tracking-wider">Produk & Saldo Dana</p>
                </div>
            </div>
            <button onclick="Portal.tab('home')"
                class="w-9 h-9 rounded-full bg-gray-50 flex items-center justify-center text-gray-400 hover:text-gray-600 transition-colors">
                <i class="bi bi-house-fill text-sm"></i>
            </button>
        </div>
    </div>

    <!-- Floating Summary Card -->
    <div class="px-6 -mt-16 relative z-10">
        <div
            class="bg-gradient-to-br from-emerald-500 via-teal-600 to-cyan-700 rounded-[2.5rem] p-7 text-white shadow-xl shadow-emerald-500/20 overflow-hidden relative">
            <!-- Premium Glass Ornaments -->
            <div
                class="absolute top-0 right-0 -mt-6 -mr-6 w-32 h-32 bg-white rounded-full mix-blend-overlay opacity-20 blur-2xl">
            </div>
            <div
                class="absolute bottom-0 left-0 -mb-6 -ml-6 w-24 h-24 bg-teal-300 rounded-full mix-blend-overlay opacity-20 blur-xl">
            </div>

            <div class="relative z-10">
                <p class="text-[10px] font-bold text-emerald-100 uppercase tracking-[0.2em] mb-1 opacity-80">Total Saldo
                    Terkumpul</p>
                <h2 class="text-3xl font-black tracking-tight drop-shadow-sm" id="simp-total-saldo">Rp —</h2>

                <div class="flex items-center justify-between mt-6 pt-5 border-t border-white/10">
                    <div>
                        <p class="text-[9px] text-emerald-100 uppercase tracking-widest mb-0.5 opacity-70">Produk Aktif
                        </p>
                        <p class="text-xs font-bold" id="simp-produk-count">— Produk</p>
                    </div>
                    <div class="text-right">
                        <p class="text-[9px] text-emerald-100 uppercase tracking-widest mb-0.5 opacity-70">Update</p>
                        <p class="text-[10px] font-medium opacity-90" id="simp-update-time">—</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Spacer for fixed header -->
<div class="h-[260px]"></div>

<!-- Produk Simpanan (container) -->
<div class="px-6 pb-24 space-y-3 mt-2" id="p-content-simpanan"></div>

<!-- Mutasi Modal (bottom sheet) -->
<div id="simp-mutasi-modal" class="modal-sheet-wrapper fixed inset-0 z-50 flex flex-col">
    <div class="modal-sheet-overlay absolute inset-0 bg-black/40 backdrop-blur-sm"
        onclick="Portal.closeModal('simp-mutasi-modal')"></div>
    <div class="flex-1 pointer-events-none"></div>
    <div
        class="modal-sheet-panel bg-white rounded-t-3xl max-h-[85vh] flex flex-col max-w-[480px] mx-auto w-full shadow-2xl relative">
        <div
            class="px-6 pt-5 pb-4 border-b border-gray-100 flex items-center justify-between sticky top-0 bg-white rounded-t-3xl">
            <div>
                <div class="w-10 h-1.5 bg-gray-200 rounded-full mx-auto mb-3"></div>
                <p id="simp-mut-judul" class="font-bold text-gray-900 text-base"></p>
                <p id="simp-mut-saldo" class="text-sm text-emerald-600 font-semibold mt-0.5"></p>
            </div>
            <button onclick="Portal.closeModal('simp-mutasi-modal')"
                class="w-9 h-9 rounded-full bg-gray-100 flex items-center justify-center text-gray-500 hover:bg-gray-200 transition-colors">
                <i class="bi bi-x-lg text-sm"></i>
            </button>
        </div>
        <div id="simp-mut-list" class="overflow-y-auto px-6 py-4 space-y-3 flex-1">
            <div class="text-center text-gray-400 text-sm py-8"><i
                    class="bi bi-hourglass-split animate-pulse text-2xl block mb-2"></i>Memuat mutasi...</div>
        </div>
    </div>
</div>
