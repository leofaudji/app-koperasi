<!-- Header Section -->
<div class="fixed top-0 left-1/2 -translate-x-1/2 w-full max-w-[480px] z-50 transition-all duration-300">
    <div class="bg-white/80 dark:bg-obsidian-950/80 backdrop-blur-xl px-6 pt-6 pb-20 border-b border-gray-100/50 dark:border-obsidian-800/50">
        <div class="flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-white dark:bg-obsidian-800 rounded-2xl flex items-center justify-center shadow-sm border border-gray-100 dark:border-obsidian-700">
                    <i class="bi bi-shop text-amber-500 text-lg"></i>
                </div>
                <div>
                    <h1 class="text-xl font-black text-gray-900 dark:text-obsidian-100 tracking-tight leading-tight">Toko Koperasi</h1>
                    <p class="text-[10px] text-gray-500 dark:text-obsidian-500 font-medium uppercase tracking-wider">Katalog & Belanja Anggota</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="Portal.openCartModal()" id="btn-header-cart" class="relative w-9 h-9 rounded-full bg-amber-50 dark:bg-amber-900/30 flex items-center justify-center text-amber-600 dark:text-amber-400 hover:bg-amber-100 transition-all active:scale-90">
                    <i class="bi bi-bag-check-fill text-sm"></i>
                    <span id="cart-badge" class="hidden absolute -top-1 -right-1 w-4 h-4 bg-rose-500 text-white rounded-full text-[9px] font-bold flex items-center justify-center border-2 border-white dark:border-obsidian-900">0</span>
                </button>
                <button onclick="Portal.tab('home')" class="w-9 h-9 rounded-full bg-gray-50 dark:bg-obsidian-800 flex items-center justify-center text-gray-400 hover:text-gray-600 dark:hover:text-obsidian-200 transition-colors">
                    <i class="bi bi-house-fill text-sm"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Floating Member Benefit Card -->
    <div class="px-6 -mt-16 relative z-10">
        <div class="bg-gradient-to-br from-amber-500 via-orange-600 to-rose-600 rounded-[2.5rem] p-6 text-white shadow-xl shadow-orange-500/20 overflow-hidden relative">
            <div class="absolute top-0 right-0 -mt-6 -mr-6 w-32 h-32 bg-white rounded-full mix-blend-overlay opacity-20 blur-2xl"></div>
            <div class="relative z-10 flex items-center justify-between">
                <div>
                    <span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-white/20 text-white text-[9px] font-bold uppercase tracking-wider mb-1.5 backdrop-blur-sm">
                        <i class="bi bi-tag-fill text-[8px]"></i> Khusus Anggota
                    </span>
                    <h3 class="text-lg font-black tracking-tight leading-tight">Harga Lebih Hemat</h3>
                    <p class="text-[10px] text-amber-100 mt-0.5 opacity-90">Bisa bayar langsung potong saldo Sukarela</p>
                </div>
                <div class="text-right bg-white/10 px-3.5 py-2.5 rounded-2xl backdrop-blur-md border border-white/20">
                    <p class="text-[8px] text-amber-200 uppercase tracking-widest font-semibold mb-0.5">Saldo Sukarela</p>
                    <p class="text-xs font-black tracking-tight" id="toko-saldo-sukarela">Rp —</p>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Spacer -->
<div class="h-[185px]"></div>

<div class="px-6 space-y-5 pb-24">
    <!-- View Switcher (Katalog / Riwayat Pesanan) -->
    <div class="flex items-center bg-gray-100 dark:bg-obsidian-900 p-1 rounded-2xl border border-gray-200/50 dark:border-obsidian-800">
        <button onclick="Portal.setTokoTab('katalog')" id="btn-tab-katalog" class="flex-1 py-2 rounded-xl text-xs font-bold text-gray-800 dark:text-obsidian-100 bg-white dark:bg-obsidian-800 shadow-sm transition-all flex items-center justify-center gap-1.5">
            <i class="bi bi-grid"></i> Katalog Produk
        </button>
        <button onclick="Portal.setTokoTab('pesanan')" id="btn-tab-pesanan" class="flex-1 py-2 rounded-xl text-xs font-medium text-gray-500 dark:text-obsidian-400 hover:text-gray-800 transition-all flex items-center justify-center gap-1.5">
            <i class="bi bi-receipt"></i> Pesanan Saya
        </button>
    </div>

    <!-- KATALOG TAB CONTENT -->
    <div id="toko-content-katalog" class="space-y-4">
        <!-- Search & Filter -->
        <div class="space-y-3">
            <div class="relative">
                <i class="bi bi-search absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
                <input type="text" id="toko-search-input" oninput="Portal.filterTokoProduk()" placeholder="Cari beras, minyak, kopi..." class="w-full bg-white dark:bg-obsidian-900 border border-gray-200 dark:border-obsidian-800 rounded-2xl pl-10 pr-4 py-2.5 text-xs text-gray-800 dark:text-obsidian-100 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-amber-500/20 focus:border-amber-500 transition-all shadow-sm">
            </div>

            <!-- Categories Chips -->
            <div id="toko-category-pills" class="flex items-center gap-2 overflow-x-auto pb-1 no-scrollbar">
                <!-- Dynamic categories -->
            </div>
        </div>

        <!-- Products Grid -->
        <div id="toko-products-grid" class="grid grid-cols-2 gap-3.5 pt-1">
            <!-- Dynamic products -->
        </div>

        <!-- Empty State -->
        <div id="toko-empty-state" class="hidden text-center py-16">
            <div class="w-16 h-16 bg-gray-100 dark:bg-obsidian-800 rounded-full flex items-center justify-center mx-auto mb-3 text-gray-400 text-2xl">
                <i class="bi bi-basket"></i>
            </div>
            <p class="text-sm font-bold text-gray-700 dark:text-obsidian-200">Tidak ada produk ditemukan</p>
            <p class="text-xs text-gray-400 mt-1">Coba kata kunci atau kategori lain</p>
        </div>
    </div>

    <!-- PESANAN SAYA TAB CONTENT -->
    <div id="toko-content-pesanan" class="hidden space-y-3">
        <div id="toko-orders-list" class="space-y-3">
            <!-- Dynamic orders -->
        </div>
        <div id="toko-orders-empty" class="hidden text-center py-16">
            <div class="w-16 h-16 bg-gray-100 dark:bg-obsidian-800 rounded-full flex items-center justify-center mx-auto mb-3 text-gray-400 text-2xl">
                <i class="bi bi-bag-x"></i>
            </div>
            <p class="text-sm font-bold text-gray-700 dark:text-obsidian-200">Belum Ada Pesanan</p>
            <p class="text-xs text-gray-400 mt-1">Pilih barang di katalog untuk mulai belanja.</p>
        </div>
    </div>
</div>

<!-- Floating Bottom Cart Bar -->
<div id="toko-floating-cart" class="fixed bottom-20 left-1/2 -translate-x-1/2 w-full max-w-[440px] px-4 z-40 transition-transform duration-300 translate-y-32 hidden">
    <div class="bg-gray-900/95 dark:bg-obsidian-900/95 backdrop-blur-xl border border-gray-800 dark:border-obsidian-700 text-white rounded-2xl p-3.5 shadow-2xl flex items-center justify-between">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-amber-500 text-white flex items-center justify-center font-black text-sm shadow-md">
                <span id="floating-cart-count">0</span>
            </div>
            <div>
                <p class="text-[10px] text-gray-400 uppercase tracking-wider font-semibold">Total Belanja</p>
                <p class="text-sm font-black text-amber-400" id="floating-cart-total">Rp 0</p>
            </div>
        </div>
        <button onclick="Portal.openCartModal()" class="px-5 py-2.5 bg-gradient-to-r from-amber-500 to-orange-600 hover:from-amber-600 hover:to-orange-700 text-white text-xs font-bold rounded-xl shadow-lg shadow-orange-500/30 transition-all active:scale-95 flex items-center gap-1.5">
            Lihat Keranjang <i class="bi bi-chevron-right text-[10px]"></i>
        </button>
    </div>
</div>
