<!-- Header Sticky -->
<div class="px-6 pt-6 pb-4 bg-[#f8fafc] sticky top-0 z-30">
    <div class="flex items-center gap-3 mb-1">
        <button onclick="Portal.tab('pinjaman')"
            class="w-8 h-8 rounded-full bg-white border border-gray-200 flex items-center justify-center text-gray-600 hover:bg-gray-50 transition-colors">
            <i class="bi bi-arrow-left"></i>
        </button>
        <h1 class="text-xl font-bold text-gray-900">Ajukan Pinjaman</h1>
    </div>
    <p class="text-xs text-gray-500 pl-11">Isi formulir untuk mensimulasikan cicilan</p>
</div>

<div class="px-6 pb-6 space-y-5">

    <form id="p-form-pengajuan-pinjaman" class="space-y-4">

        <!-- Jenis Pinjaman -->
        <div class="space-y-1.5">
            <label class="block text-[10px] font-bold text-gray-600 uppercase tracking-wider">Pilih Jenis
                Pinjaman</label>
            <div class="relative">
                <i class="bi bi-tags-fill absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400"></i>
                <select id="p-sim-jenis" required
                    class="w-full bg-white border border-gray-200 rounded-xl px-4 py-3 pl-10 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all text-gray-700 appearance-none">
                    <option value="" disabled selected>Pilih salah satu...</option>
                    <!-- Options populated by JS -->
                </select>
                <i
                    class="bi bi-chevron-down absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 text-xs pointer-events-none"></i>
            </div>
        </div>

        <!-- Nominal Pinjaman -->
        <div class="space-y-1.5">
            <label class="block text-[10px] font-bold text-gray-600 uppercase tracking-wider">Nominal Pinjaman</label>
            <div class="relative">
                <span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-500 font-bold text-xs">Rp</span>
                <input type="text" id="p-sim-nominal" required
                    class="w-full bg-white border border-gray-200 rounded-xl px-4 py-3 pl-10 text-sm font-bold focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all placeholder-gray-400"
                    placeholder="0">
            </div>
            <p class="text-[9px] text-gray-500" id="p-sim-limit-hint">Pilih jenis pinjaman untuk melihat batas maksimal.
            </p>
        </div>

        <!-- Tenor -->
        <div class="space-y-1.5">
            <label class="block text-[10px] font-bold text-gray-600 uppercase tracking-wider">Tenor (Bulan)</label>
            <div class="relative">
                <i class="bi bi-calendar-range-fill absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400"></i>
                <input type="number" id="p-sim-tenor" min="1" required
                    class="w-full bg-white border border-gray-200 rounded-xl px-4 py-3 pl-10 pr-16 text-sm font-bold focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all placeholder-gray-400"
                    placeholder="Contoh: 12">
                <span
                    class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 text-xs font-medium pointer-events-none">Bulan</span>
            </div>
        </div>

        <!-- Tujuan -->
        <div class="space-y-1.5">
            <label class="block text-[10px] font-bold text-gray-600 uppercase tracking-wider">Tujuan Pinjaman</label>
            <div class="relative">
                <i class="bi bi-chat-text-fill absolute left-3.5 top-3.5 text-gray-400"></i>
                <textarea id="p-sim-tujuan" required rows="2"
                    class="w-full bg-white border border-gray-200 rounded-xl px-4 py-3 pl-10 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all placeholder-gray-400"
                    placeholder="Ceritakan singkat untuk apa dana ini digunakan..."></textarea>
            </div>
        </div>

    </form>

    <!-- Simulasi Card (Hidden initially) -->
    <div id="p-sim-result"
        class="hidden bg-gradient-to-b from-blue-50 to-white rounded-2xl border border-blue-100 p-5 shadow-sm">
        <h3 class="font-bold text-blue-900 text-sm mb-3 flex items-center gap-2"><i class="bi bi-calculator"></i> Hasil
            Simulasi</h3>
        <div class="space-y-3">
            <div class="flex justify-between items-center border-b border-blue-100/50 pb-2">
                <span class="text-xs text-gray-600">Estimasi Cicilan Pokok</span>
                <span class="text-sm font-bold text-gray-900" id="sr-pokok">Rp 0</span>
            </div>
            <div class="flex justify-between items-center border-b border-blue-100/50 pb-2">
                <span class="text-xs text-gray-600">Estimasi Bunga</span>
                <span class="text-sm font-bold text-rose-600" id="sr-bunga">Rp 0</span>
            </div>
            <div class="flex justify-between items-center pt-1">
                <span class="text-xs font-bold text-blue-900">Total Angsuran / Bulan</span>
                <span class="text-lg font-black text-blue-700" id="sr-angsuran">Rp 0</span>
            </div>
        </div>
    </div>

    <!-- Alert message -->
    <div id="p-sim-alert" class="hidden text-xs px-4 py-3 rounded-xl border"></div>

    <button type="button" id="p-btn-submit-loan"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3.5 rounded-2xl font-bold shadow-md shadow-blue-500/20 active:scale-[0.98] transition-all flex justify-center items-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
        <i class="bi bi-send-check"></i> Kirim Pengajuan Pinjaman
    </button>

</div>
