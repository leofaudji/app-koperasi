<div class="px-6 pt-6 pb-4 bg-[#f8fafc] sticky top-0 z-30">
    <h1 class="text-xl font-bold text-gray-900 mb-1">Profil Anda</h1>
    <p class="text-xs text-gray-500">Pengaturan akun dan keamanan</p>
</div>
<div class="px-6 pb-6 space-y-6">
    <!-- Digital Member Card (Flippable) -->
    <div class="flip-card">
        <div class="flip-card-inner h-[210px]">
            <!-- Front Side -->
            <div class="flip-card-front">
                <div
                    class="relative h-full overflow-hidden rounded-3xl p-6 shadow-xl bg-gradient-to-br from-indigo-700 via-blue-600 to-cyan-500 text-white text-left">
                    <!-- Background Ornaments -->
                    <div
                        class="absolute top-0 right-0 -mt-4 -mr-4 w-32 h-32 bg-white rounded-full mix-blend-overlay opacity-10 blur-2xl">
                    </div>
                    <div
                        class="absolute bottom-0 left-0 -mb-4 -ml-4 w-24 h-24 bg-blue-300 rounded-full mix-blend-overlay opacity-20 blur-xl">
                    </div>

                    <div class="relative z-10 flex justify-between items-start mb-6">
                        <div>
                            <h3 class="font-bold text-sm tracking-widest uppercase opacity-90 drop-shadow-sm">Member
                                Koperasi</h3>
                            <p class="text-[9px] opacity-75 mt-0.5" id="p-tgl-gabung">Bersama Sejak 2026</p>
                        </div>
                        <div
                            class="w-10 h-10 rounded-xl bg-white/20 backdrop-blur-sm border border-white/30 flex items-center justify-center shrink-0 shadow-inner">
                            <i class="bi bi-wallet2 text-xl shadow-sm"></i>
                        </div>
                    </div>

                    <div class="relative z-10 mb-6">
                        <div
                            class="w-12 h-8 rounded-md bg-gradient-to-r from-yellow-200 to-yellow-500 opacity-80 mb-2 border border-yellow-300/50 shadow-sm flex items-center justify-center">
                            <div class="w-8 h-4 border border-yellow-700/20 rounded-sm"></div>
                        </div>
                        <p class="font-mono text-xl tracking-[0.2em] font-medium drop-shadow-md truncate"
                            id="p-no-profil">AGT-0000</p>
                    </div>

                    <div class="relative z-10 flex justify-between items-end">
                        <div class="flex-1 mr-4">
                            <p class="text-[9px] uppercase tracking-wider opacity-70 mb-0.5">Nama Anggota</p>
                            <p class="font-bold text-base uppercase drop-shadow-sm truncate" id="p-nama-profil">
                                Nama Lengkap</p>
                        </div>
                        <img id="p-avatar-profil" src="" alt="Avatar"
                            class="w-12 h-12 rounded-full border-2 border-white/50 shadow-lg">
                    </div>

                    <!-- Flip Toggle Front -->
                    <div class="btn-flip" onclick="Portal.flipCard()" title="Lihat Kode QR">
                        <i class="bi bi-qr-code text-white"></i>
                    </div>
                </div>
            </div>

            <!-- Back Side -->
            <div class="flip-card-back">
                <div class="nfc-indicator"></div>
                <div class="p-6 w-full h-full flex flex-col items-center justify-center relative">
                    <p class="text-[10px] font-bold text-blue-400 uppercase tracking-[0.2em] mb-4">Absensi & Verifikasi
                    </p>

                    <!-- QR Code Container -->
                    <div id="p-qrcode"
                        class="p-3 bg-white rounded-2xl shadow-inner mb-4 flex items-center justify-center min-w-[160px] min-h-[160px]">
                        <!-- QRCode.js will render here -->
                    </div>

                    <p class="text-[10px] text-gray-400 font-medium mb-1">Scan QR atau Tempel NFC</p>

                    <!-- NFC Mockup Strip -->
                    <div onclick="Portal.simulateNFC()"
                        class="px-4 py-2 bg-slate-800 border border-slate-700 rounded-full flex items-center gap-2 cursor-pointer active:scale-95 transition-transform hover:bg-slate-700">
                        <i class="bi bi-phone-vibrate text-blue-400"></i>
                        <span class="text-[10px] font-bold text-gray-300">ACTIVATE NFC CHIP</span>
                    </div>

                    <!-- Flip Toggle Back -->
                    <div class="btn-flip" onclick="Portal.flipCard()" title="Kembali ke Depan">
                        <i class="bi bi-person-badge text-white"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="bg-white rounded-3xl border border-gray-100 shadow-sm overflow-hidden">
        <div class="px-5 py-4 border-b border-gray-50 mb-2">
            <h3 class="text-sm font-bold text-gray-800"><i class="bi bi-shield-lock text-blue-500 mr-2"></i>Keamanan
                Akun</h3>
        </div>
        <form id="p-form-password" class="p-5 pt-2 space-y-4">
            <div id="p-pwd-alert" class="hidden text-xs px-3 py-2 rounded-xl mb-3 border"></div>

            <div class="space-y-1.5">
                <label class="block text-[10px] font-bold text-gray-600 uppercase tracking-wider">Password
                    Lama</label>
                <div class="relative">
                    <i class="bi bi-key-fill absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400"></i>
                    <input type="password" id="p-old-pwd" required
                        class="w-full bg-gray-50 border border-gray-100 rounded-xl px-4 py-2.5 pl-10 text-sm focus:bg-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all placeholder-gray-400"
                        placeholder="Masukkan password saat ini">
                </div>
            </div>

            <div class="space-y-1.5">
                <label class="block text-[10px] font-bold text-gray-600 uppercase tracking-wider">Password
                    Baru</label>
                <div class="relative">
                    <i class="bi bi-lock-fill absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400"></i>
                    <input type="password" id="p-new-pwd" required minlength="6"
                        class="w-full bg-gray-50 border border-gray-100 rounded-xl px-4 py-2.5 pl-10 text-sm focus:bg-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all placeholder-gray-400"
                        placeholder="Minimal 6 karakter">
                </div>
            </div>

            <div class="space-y-1.5">
                <label class="block text-[10px] font-bold text-gray-600 uppercase tracking-wider">Ulangi
                    Password Baru</label>
                <div class="relative">
                    <i class="bi bi-check-circle-fill absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400"></i>
                    <input type="password" id="p-new-pwd-confirm" required minlength="6"
                        class="w-full bg-gray-50 border border-gray-100 rounded-xl px-4 py-2.5 pl-10 text-sm focus:bg-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all placeholder-gray-400"
                        placeholder="Ketik ulang password baru">
                </div>
            </div>

            <button type="submit" id="p-btn-pwd"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white mt-2 py-3 rounded-xl font-bold shadow-md shadow-blue-500/20 active:scale-[0.98] transition-all flex justify-center items-center gap-2 text-sm">
                <i class="bi bi-save"></i> Simpan Password
            </button>
        </form>
    </div>

    <!-- Menu Fungsional -->
    <div class="bg-white rounded-3xl border border-gray-100 shadow-sm overflow-hidden mb-6">
        <div class="px-5 py-4 border-b border-gray-50 mb-2">
            <h3 class="text-sm font-bold text-gray-800"><i class="bi bi-grid-fill text-indigo-500 mr-2"></i>Lainnya</h3>
        </div>
        <div class="flex flex-col">
            <button onclick="Swal.fire({
                title: 'Pusat Bantuan',
                html: '<div class=\'text-left space-y-3\'><p class=\'text-sm\'>Ada pertanyaan atau kendala? Hubungi tim support kami melalui:</p><div class=\'flex flex-col gap-2\'><a href=\'https://wa.me/6281234567890\' target=\'_blank\' class=\'flex items-center gap-3 p-3 bg-emerald-50 text-emerald-700 rounded-2xl border border-emerald-100\'><i class=\'bi bi-whatsapp text-xl\'></i><div><p class=\'font-bold text-xs\'>WhatsApp Support</p><p class=\'text-[10px]\'>Respon cepat (08:00 - 17:00)</p></div></a><div class=\'flex items-center gap-3 p-3 bg-blue-50 text-blue-700 rounded-2xl border border-blue-100\'><i class=\'bi bi-envelope text-xl\'></i><div><p class=\'font-bold text-xs\'>Email Helpdesk</p><p class=\'text-[10px]\'>support@koperasi.id</p></div></div></div></div>',
                showConfirmButton: false,
                showCloseButton: true,
                customClass: { popup: 'rounded-3xl' }
            })"
                class="px-5 py-4 flex items-center justify-between hover:bg-gray-50 active:bg-gray-100 transition-colors border-b border-gray-50/50">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-full bg-blue-50 text-blue-600 flex items-center justify-center"><i
                            class="bi bi-headset"></i></div>
                    <span class="text-sm font-medium text-gray-700">Pusat Bantuan</span>
                </div>
                <i class="bi bi-chevron-right text-gray-300 text-xs"></i>
            </button>
            <button onclick="Swal.fire({
                title: 'Syarat & Ketentuan',
                html: '<div class=\'text-left text-xs text-gray-600 max-h-[300px] overflow-y-auto space-y-4 pr-2\'>' +
                      '<p><strong>1. Keanggotaan:</strong> Setiap anggota wajib menaati AD/ART Koperasi dan memelihara kerahasiaan kredensial login portal.</p>' +
                      '<p><strong>2. Transaksi:</strong> Data yang ditampilkan adalah real-time sesuai dengan input sistem pusat. Koperasi berhak membatalkan transaksi jika ditemukan ketidaksesuaian data.</p>' +
                      '<p><strong>3. Keamanan:</strong> Anggota disarankan mengganti password secara berkala melalu menu Keamanan Akun.</p>' +
                      '<p><strong>4. Layanan:</strong> Portal tersedia 24/7 namun maintenance sistem dapat dilakukan sewaktu-waktu dengan pemberitahuan sebelumnya.</p>' +
                      '<p class=\'pt-2 italic text-[10px]\'>Pembaruan terakhir: 01 Maret 2026</p></div>',
                confirmButtonText: 'Saya Mengerti',
                confirmButtonColor: '#2563eb',
                customClass: { popup: 'rounded-3xl', confirmButton: 'rounded-xl w-full py-3 font-bold' }
            })"
                class="px-5 py-4 flex items-center justify-between hover:bg-gray-50 active:bg-gray-100 transition-colors border-b border-gray-50/50">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-full bg-emerald-50 text-emerald-600 flex items-center justify-center"><i
                            class="bi bi-file-earmark-text"></i></div>
                    <span class="text-sm font-medium text-gray-700">Syarat & Ketentuan</span>
                </div>
                <i class="bi bi-chevron-right text-gray-300 text-xs"></i>
            </button>
            <button onclick="Swal.fire({
                title: 'Tentang Aplikasi',
                html: '<div class=\'flex flex-col items-center py-4\'><div class=\'w-16 h-16 bg-blue-600 rounded-3xl flex items-center justify-center mb-4\'><i class=\'bi bi-wallet2 text-3xl text-white\'></i></div><p class=\'font-bold text-gray-900\'>Koperasi PWA Portal</p><p class=\'text-xs text-gray-500 mb-4\'>Versi 1.0.0 (Stable)</p><div class=\'w-full border-t border-gray-100 pt-4 text-center\'><p class=\'text-[10px] text-gray-400\'>&copy; 2026 Tim IT Koperasi Simpan Pinjam.<br>Seluruh hak cipta dilindungi.</p></div></div>',
                showConfirmButton: false,
                showCloseButton: true,
                customClass: { popup: 'rounded-3xl' }
            })"
                class="px-5 py-4 flex items-center justify-between hover:bg-gray-50 active:bg-gray-100 transition-colors">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-full bg-amber-50 text-amber-600 flex items-center justify-center"><i
                            class="bi bi-info-circle"></i></div>
                    <span class="text-sm font-medium text-gray-700">Tentang Aplikasi</span>
                </div>
                <i class="bi bi-chevron-right text-gray-300 text-xs"></i>
            </button>
        </div>
    </div>

    <!-- Logout Button -->
    <button onclick="Portal.logout()"
        class="w-full bg-white border border-rose-100 hover:bg-rose-50 text-rose-600 py-3.5 rounded-2xl font-bold shadow-sm active:scale-[0.98] transition-all flex justify-center items-center gap-2 mt-4">
        <i class="bi bi-box-arrow-right"></i> Keluar dari Portal
    </button>
</div>
