<!-- Header Fixed -->
<div
    class="fixed top-0 left-1/2 -translate-x-1/2 w-full max-w-[480px] px-6 pt-6 pb-4 bg-[#f8fafc]/95 backdrop-blur-md z-30 shadow-sm border-b border-gray-100">
    <div class="flex items-center gap-3 mb-4 pr-12">
        <div
            class="w-10 h-10 bg-gradient-to-br from-rose-500 to-orange-500 rounded-2xl flex items-center justify-center shadow-rose-500/30 shadow-md shrink-0">
            <i class="bi bi-cash-stack text-white text-lg"></i>
        </div>
        <div>
            <h1 class="text-xl font-bold text-gray-900 leading-tight">Pinjaman</h1>
            <p class="text-[10px] text-gray-500 font-medium uppercase tracking-wider mt-0.5">Daftar pembiayaan aktif dan
                lunas
            </p>
        </div>
    </div>
    <!-- Summary Card Integrated -->
    <div class="bg-gradient-to-br from-rose-500 to-orange-500 rounded-2xl p-4 text-white shadow-lg shadow-rose-500/20">
        <p class="text-[10px] text-rose-100 uppercase tracking-wider mb-1">Total Sisa Kewajiban Aktif</p>
        <p class="text-2xl font-bold font-mono" id="pin-total-sisa">Rp —</p>
        <div class="grid grid-cols-3 gap-2 mt-3 pt-3 border-t border-white/20">
            <div>
                <p class="text-[9px] text-rose-100 uppercase tracking-widest mb-0.5">Dipinjam</p>
                <p class="text-xs font-semibold" id="pin-total-pinjam">Rp —</p>
            </div>
            <div>
                <p class="text-[9px] text-rose-100 uppercase tracking-widest mb-0.5">Sudah Bayar</p>
                <p class="text-xs font-semibold" id="pin-total-bayar">Rp —</p>
            </div>
            <div class="text-right">
                <p class="text-[9px] text-rose-100 uppercase tracking-widest mb-0.5">Aktif</p>
                <p class="text-xs font-semibold" id="pin-jml">— Akun</p>
            </div>
        </div>
    </div>
</div>

<!-- Spacer for fixed header -->
<div class="h-[240px]"></div>

<div class="px-6 space-y-4 pb-28 mt-2">
    <!-- Active loans list -->
    <div id="p-content-pinjaman" class="space-y-4"></div>

    <!-- Riwayat Lunas summary row (hidden until data arrives) -->
    <div id="pin-lunas-summary" class="hidden cursor-pointer" onclick="Portal.openModal('pin-lunas-modal')">
        <div
            class="bg-emerald-50 border border-emerald-200 rounded-2xl p-4 flex items-center justify-between hover:bg-emerald-100 transition-colors active:scale-[0.99]">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-emerald-100 flex items-center justify-center shrink-0">
                    <i class="bi bi-check-circle-fill text-emerald-600 text-lg"></i>
                </div>
                <div>
                    <p class="text-sm font-bold text-emerald-800">Riwayat Pinjaman Lunas</p>
                    <p class="text-[10px] text-emerald-600" id="pin-lunas-count">— akun terlunasi</p>
                </div>
            </div>
            <i class="bi bi-chevron-right text-emerald-500 text-sm"></i>
        </div>
    </div>
</div>

<!-- FAB -->
<button onclick="Portal.tab('pengajuan_pinjaman')"
    class="fixed bottom-24 right-6 w-14 h-14 bg-rose-600 hover:bg-rose-700 text-white rounded-full flex items-center justify-center shadow-lg shadow-rose-500/30 transition-transform active:scale-90 z-40">
    <i class="bi bi-plus-lg text-2xl"></i>
</button>

<!-- Angsuran Modal -->
<div id="pin-angsuran-modal" class="modal-sheet-wrapper fixed inset-0 z-50 flex flex-col">
    <div class="modal-sheet-overlay absolute inset-0 bg-black/40 backdrop-blur-sm"
        onclick="Portal.closeModal('pin-angsuran-modal')"></div>
    <div class="flex-1 pointer-events-none"></div>
    <div
        class="modal-sheet-panel bg-white rounded-t-3xl max-h-[85vh] flex flex-col max-w-[480px] mx-auto w-full shadow-2xl relative">
        <div class="px-6 pt-5 pb-4 border-b border-gray-100 sticky top-0 bg-white rounded-t-3xl">
            <div class="w-10 h-1.5 bg-gray-200 rounded-full mx-auto mb-3"></div>
            <div class="flex items-start justify-between">
                <div>
                    <p id="pin-ang-no" class="font-bold text-gray-900 text-base"></p>
                    <p id="pin-ang-jenis" class="text-xs text-gray-500 mt-0.5"></p>
                </div>
                <button onclick="Portal.closeModal('pin-angsuran-modal')"
                    class="w-9 h-9 rounded-full bg-gray-100 flex items-center justify-center text-gray-500 hover:bg-gray-200 transition-colors shrink-0 ml-3">
                    <i class="bi bi-x-lg text-sm"></i>
                </button>
            </div>
            <!-- Info Bar -->
            <div class="grid grid-cols-3 gap-2 mt-3 bg-rose-50 rounded-xl p-3">
                <div class="text-center">
                    <p class="text-[9px] text-rose-400 uppercase tracking-widest mb-0.5">Pinjaman</p>
                    <p class="text-xs font-bold text-rose-700" id="pin-ang-total"></p>
                </div>
                <div class="text-center border-x border-rose-200">
                    <p class="text-[9px] text-rose-400 uppercase tracking-widest mb-0.5">Sudah Bayar</p>
                    <p class="text-xs font-bold text-emerald-600" id="pin-ang-bayar"></p>
                </div>
                <div class="text-center">
                    <p class="text-[9px] text-rose-400 uppercase tracking-widest mb-0.5">Sisa</p>
                    <p class="text-xs font-bold text-rose-700" id="pin-ang-sisa"></p>
                </div>
            </div>
        </div>
        <div id="pin-ang-list" class="overflow-y-auto px-6 py-4 space-y-2 flex-1"></div>
    </div>
</div>

<!-- Riwayat Lunas Modal -->
<div id="pin-lunas-modal" class="modal-sheet-wrapper fixed inset-0 z-50 flex flex-col">
    <div class="modal-sheet-overlay absolute inset-0 bg-black/40 backdrop-blur-sm"
        onclick="Portal.closeModal('pin-lunas-modal')"></div>
    <div class="flex-1 pointer-events-none"></div>
    <div
        class="modal-sheet-panel bg-white rounded-t-3xl max-h-[85vh] flex flex-col max-w-[480px] mx-auto w-full shadow-2xl relative">
        <div class="px-6 pt-5 pb-4 border-b border-gray-100 sticky top-0 bg-white rounded-t-3xl">
            <div class="w-10 h-1.5 bg-gray-200 rounded-full mx-auto mb-3"></div>
            <div class="flex items-center justify-between">
                <div>
                    <p class="font-bold text-gray-900 text-base flex items-center gap-2">
                        <i class="bi bi-check-circle-fill text-emerald-500"></i> Riwayat Pinjaman Lunas
                    </p>
                    <p class="text-[10px] text-gray-400 mt-0.5">Pembiayaan yang telah terlunasi</p>
                </div>
                <button onclick="Portal.closeModal('pin-lunas-modal')"
                    class="w-9 h-9 rounded-full bg-gray-100 flex items-center justify-center text-gray-500 hover:bg-gray-200 transition-colors shrink-0 ml-3">
                    <i class="bi bi-x-lg text-sm"></i>
                </button>
            </div>
        </div>
        <div id="pin-lunas-list" class="overflow-y-auto px-6 py-4 space-y-2 flex-1"></div>
    </div>
</div>
