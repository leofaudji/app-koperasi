<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#4F46E5">
    <meta name="description" content="Portal Anggota Koperasi Simpan Pinjam">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="icon" type="image/png" href="../assets/images/favicon.png">
    <title>Portal Anggota - Koperasi</title>
    <script src="assets/js/tailwind.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        obsidian: {
                            50: '#f8fafc',
                            100: '#f1f5f9',
                            200: '#e2e8f0',
                            300: '#cbd5e1',
                            400: '#94a3b8',
                            500: '#64748b',
                            600: '#475569',
                            700: '#334155',
                            800: '#1e293b',
                            900: '#0f172a',
                            950: '#020617',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="assets/js/sweetalert2.all.min.js"></script>
    <script>
        // Apply theme immediately to prevent flashing
        if (localStorage.getItem('kop_portal_theme') === 'dark') {
            document.documentElement.classList.add('dark');
        }
    </script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');

        body {
            background-color: #f1f5f9;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
            /* Hide scrollbar by default for a clean app-like feel */
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        body::-webkit-scrollbar, .custom-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .custom-scrollbar {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .mobile-container {
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            background: #f8fafc;
            position: relative;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.05);
            overflow-x: hidden;
            /* Hide scrollbar for internal scrolling if any */
            scrollbar-width: none;
            -ms-overflow-style: none;
            transition: background-color 0.3s ease;
        }

        html.dark body { background-color: #020617; }
        html.dark .mobile-container { background-color: #020617; }

        .mobile-container::-webkit-scrollbar {
            display: none;
        }

        /* SweetAlert2 Dark Mode Overrides */
        .dark .swal2-popup {
            background: #0f172a !important;
            color: #f1f5f9 !important;
            border: 1px solid #1e293b !important;
            border-radius: 2.5rem !important;
        }

        .dark .swal2-title, .dark .swal2-html-container {
            color: #f1f5f9 !important;
        }

        .dark .swal2-input, .dark .swal2-textarea {
            background: #020617 !important;
            border-color: #1e293b !important;
            color: #f1f5f9 !important;
        }

        .dark .swal2-confirm {
            background-color: #2563eb !important;
        }

        .dark .swal2-cancel {
            background-color: #1e293b !important;
            color: #94a3b8 !important;
        }

        /* Modern Wallet Card */
        .wallet-card {
            background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%);
            border-radius: 1.5rem;
            padding: 1.5rem;
            color: white;
            position: relative;
            overflow: hidden;
            box-shadow: 0 15px 30px -5px rgba(37, 99, 235, 0.4);
        }

        .wallet-card::after {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 200px;
            height: 200px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            pointer-events: none;
        }

        /* 3D Card Flip */
        .flip-card {
            background-color: transparent;
            width: 100%;
            perspective: 1000px;
            margin-bottom: 1.5rem;
        }

        .flip-card-inner {
            position: relative;
            width: 100%;
            text-align: center;
            transition: transform 0.8s;
            transform-style: preserve-3d;
        }

        .flip-card.flipped .flip-card-inner {
            transform: rotateY(180deg);
        }

        .flip-card-front,
        .flip-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 1.5rem;
        }

        .flip-card-back {
            transform: rotateY(180deg);
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-flip {
            position: absolute;
            bottom: 1rem;
            right: 1rem;
            width: 2.5rem;
            height: 2.5rem;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(4px);
            border-radius: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 20;
            transition: all 0.2s;
        }

        .btn-flip:active {
            transform: scale(0.9);
        }

        .nfc-indicator {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, transparent, #60a5fa, transparent);
            background-size: 200% 100%;
            animation: nfc-pulse 2s infinite linear;
            opacity: 0.6;
            border-radius: 1.5rem 1.5rem 0 0;
        }

        @keyframes nfc-pulse {
            0% {
                background-position: 100% 0;
            }

            100% {
                background-position: -100% 0;
            }
        }

        .nav-item {
            color: #94a3b8;
            transition: all 0.3s ease;
            position: relative;
        }

        .nav-item.active {
            color: #2563eb;
            font-weight: 600;
        }

        .nav-item.active::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 12px;
            height: 3px;
            background: #2563eb;
            border-radius: 10px;
            box-shadow: 0 2px 4px rgba(37, 99, 235, 0.3);
            animation: barExpand 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes barExpand {
            from { width: 0; opacity: 0; }
            to { width: 12px; opacity: 1; }
        }

        @keyframes navPop {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1.1); }
        }

        .nav-item.active i {
            animation: navPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            color: #2563eb;
            filter: drop-shadow(0 0 8px rgba(37, 99, 235, 0.3));
        }

        .nav-item {
            padding: 8px 12px;
            border-radius: 16px;
            transition: all 0.3s ease;
        }

        .nav-item.active {
            background: rgba(37, 99, 235, 0.05);
        }

        html.dark .nav-item.active {
            background: rgba(37, 99, 235, 0.1);
        }

        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .fade-in {
            animation: fadeIn 0.3s ease;
        }

        /* Tab Transition Animation - Native Feel */
        .tab-content {
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .tab-content:not(.hidden) {
            opacity: 1;
            transform: translateX(0) translateY(0);
        }

        .slide-in-right {
            animation: slideInRight 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .slide-in-left {
            animation: slideInLeft 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideInRight {
            0% { opacity: 0; transform: translateX(30px); }
            100% { opacity: 1; transform: translateX(0); }
        }

        @keyframes slideInLeft {
            0% { opacity: 0; transform: translateX(-30px); }
            100% { opacity: 1; transform: translateX(0); }
        }

        @keyframes tabSlideUp {
            0% {
                opacity: 0;
                transform: translateY(20px) scale(0.98);
            }

            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Initial Splash Screen */
        #initial-splash {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at top right, #3b82f6 0%, #1e40af 100%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: background 1.5s ease-in-out, opacity 0.8s ease-in-out, transform 0.8s ease-in-out;
        }

        /* Dynamic Time-based Backgrounds */
        #initial-splash.bg-morning { background: linear-gradient(135deg, #0ea5e9 0%, #2563eb 100%); }
        #initial-splash.bg-day { background: radial-gradient(circle at top right, #3b82f6 0%, #1e40af 100%); }
        #initial-splash.bg-evening { background: linear-gradient(135deg, #f97316 0%, #4338ca 100%); }
        #initial-splash.bg-night { background: radial-gradient(circle at top right, #1e293b 0%, #020617 100%); }

        #initial-splash.fade-out {
            opacity: 0;
            visibility: hidden;
            transform: scale(1.1);
        }

        .splash-loader {
            width: 48px;
            height: 48px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: inline-block;
            position: relative;
            box-sizing: border-box;
            animation: rotation 1s linear infinite;
        }

        .splash-loader::after {
            content: '';
            box-sizing: border-box;
            position: absolute;
            left: 0;
            top: 0;
            background: white;
            width: 12px;
            height: 12px;
            transform: translate(-50%, 50%);
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        @keyframes rotation {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .branding-appear {
            animation: brandingSlideUp 1s cubic-bezier(0.23, 1, 0.32, 1) forwards;
        }

        @keyframes brandingSlideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Splash Screen Animations */
        @keyframes popIn {
            0% {
                transform: scale(0.5);
                opacity: 0;
            }

            70% {
                transform: scale(1.1);
                opacity: 1;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes drawCheck {
            0% {
                clip-path: inset(100% 0 0 0);
            }

            100% {
                clip-path: inset(0 0 0 0);
            }
        }

        @keyframes slideUpFade {
            0% {
                transform: translateY(20px);
                opacity: 0;
            }

            100% {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .splash-logo {
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .splash-icon {
            animation: drawCheck 0.5s ease-out 0.4s both;
        }

        .splash-text {
            animation: slideUpFade 0.5s ease-out 0.6s both;
        }

        .splash-subtext {
            animation: slideUpFade 0.5s ease-out 0.8s both;
        }

        /* PWA Install Banner */
        #pwa-install-banner {
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform: translateY(120%);
        }

        #pwa-install-banner.show {
            transform: translateY(0);
        }

        /* Pull to Refresh */
        .ptr-container {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            z-index: 20;
            pointer-events: none;
        }

        .ptr-spinner {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 3px solid #e2e8f0;
            border-top-color: #4F46E5;
            opacity: 0;
            transform: scale(0.5);
            transition: opacity 0.2s, transform 0.2s;
        }

        .ptr-spinner.refreshing {
            animation: ptrSpin 0.8s linear infinite;
            opacity: 1;
            transform: scale(1);
        }

        @keyframes ptrSpin {
            to {
                transform: rotate(360deg) scale(1);
            }
        }

        /* ── Bottom Sheet Modal Animations ── */
        .modal-sheet-overlay {
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal-sheet-overlay.open {
            opacity: 1;
        }

        .modal-sheet-panel {
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .modal-sheet-panel.open {
            transform: translateY(0);
        }

        /* Wrapper hidden until shown */
        .modal-sheet-wrapper {
            visibility: hidden;
        }

        .modal-sheet-wrapper.visible {
            visibility: visible;
        }
    </style>
</head>

<body class="overflow-hidden">
    <!-- Initial Professional Splash Screen -->
    <div id="initial-splash">
        <div class="flex flex-col items-center branding-appear">
            <div class="w-32 h-32 mb-8 relative">
                <div
                    class="absolute inset-0 bg-white/10 backdrop-blur-xl rounded-[2.5rem] rotate-6 scale-90 opacity-50">
                </div>
                <div
                    class="absolute inset-0 bg-white/20 backdrop-blur-xl rounded-[2.5rem] -rotate-3 scale-95 opacity-80">
                </div>
                <div
                    class="relative w-full h-full bg-white rounded-[2.5rem] shadow-2xl flex items-center justify-center overflow-hidden border border-white/50">
                    <img id="splash-logo-img" src="{{LOGO_URL}}"
                        class="w-20 h-20 object-contain p-2 transition-transform duration-700 hover:scale-110"
                        onerror="this.onerror=null; this.src='../assets/images/favicon.png';">
                </div>
            </div>

            <div class="text-center">
                <h1 class="text-3xl font-bold text-white tracking-tight mb-2">{{PWA_NAME}}</h1>
                <div class="flex items-center justify-center gap-3">
                    <span class="w-12 h-[1px] bg-white/20"></span>
                    <span class="text-white/60 text-[10px] uppercase tracking-[0.2em] font-medium">Digital Portal</span>
                    <span class="w-12 h-[1px] bg-white/20"></span>
                </div>
            </div>
        </div>

        <div class="absolute bottom-24 flex flex-col items-center gap-4">
            <span class="splash-loader"></span>
            <p id="splash-loader-text" class="text-white/40 text-[9px] uppercase tracking-widest animate-pulse">Initializing System...</p>
        </div>

        <!-- Financial Wisdom/Tips -->
        <div class="absolute bottom-12 px-10 text-center branding-appear" style="animation-delay: 0.5s">
            <p id="splash-tip" class="text-white/30 text-[10px] leading-relaxed italic font-medium max-w-[280px]"></p>
        </div>
    </div>

    <div class="mobile-container">
        <!-- Login -->
        <div id="portal-login"
            class="min-h-screen flex flex-col items-center justify-center p-6 bg-white dark:bg-obsidian-950 relative overflow-hidden transition-colors duration-300">
            <!-- Decorative Background Elements -->
            <div
                class="absolute top-0 right-0 w-64 h-64 bg-blue-50 dark:bg-blue-900/10 rounded-full blur-3xl -translate-y-1/2 translate-x-1/2">
            </div>
            <div
                class="absolute bottom-0 left-0 w-48 h-48 bg-purple-50 dark:bg-purple-900/10 rounded-full blur-3xl translate-y-1/2 -translate-x-1/2">
            </div>

            <div class="w-full relative z-10">
                <div class="text-center mb-10">
                    <div
                        class="w-20 h-20 bg-gradient-to-br from-blue-600 to-indigo-700 rounded-[2rem] flex items-center justify-center mx-auto mb-6 shadow-xl shadow-blue-500/30 transform rotate-12 hover:rotate-0 transition-all duration-300">
                        <i class="bi bi-wallet2 text-white text-3xl -rotate-12 hover:rotate-0"></i>
                    </div>
                    <h1 class="text-2xl font-bold text-gray-900 dark:text-obsidian-100 tracking-tight">Portal Anggota</h1>
                    <p class="text-gray-500 dark:text-obsidian-400 text-sm mt-1">Koperasi Simpan Pinjam</p>
                </div>

                <form id="p-login-form" class="space-y-5">
                    <div id="p-login-error"
                        class="hidden bg-red-50 border border-red-100 text-red-600 rounded-2xl px-4 py-3 text-xs flex items-center gap-2">
                        <i class="bi bi-exclamation-circle-fill"></i> <span id="p-login-error-msg"></span>
                    </div>

                    <div class="space-y-1.5">
                        <label class="block text-xs font-bold text-gray-700 dark:text-obsidian-300 uppercase tracking-wide">No. Anggota</label>
                        <div class="relative">
                            <i class="bi bi-person absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-lg"></i>
                            <input type="text" id="p-no-anggota"
                                class="w-full bg-gray-50 dark:bg-obsidian-900 border border-gray-100 dark:border-obsidian-800 rounded-2xl px-5 py-3.5 pl-11 text-sm focus:bg-white dark:focus:bg-obsidian-800 focus:ring-2 focus:ring-blue-500 transition-all dark:text-obsidian-100"
                                placeholder="mis. AGT-0001" required>
                        </div>
                    </div>

                    <div class="space-y-1.5">
                        <label class="block text-xs font-bold text-gray-700 dark:text-obsidian-300 uppercase tracking-wide">Password</label>
                        <div class="relative">
                            <i class="bi bi-lock absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-lg"></i>
                            <input type="password" id="p-password"
                                class="w-full bg-gray-50 dark:bg-obsidian-900 border border-gray-100 dark:border-obsidian-800 rounded-2xl px-5 py-3.5 pl-11 text-sm focus:bg-white dark:focus:bg-obsidian-800 focus:ring-2 focus:ring-blue-500 transition-all dark:text-obsidian-100"
                                placeholder="Masukkan password" required>
                        </div>
                    </div>

                    <button type="submit" id="p-login-btn"
                        class="w-full bg-blue-600 text-white mt-8 py-3.5 rounded-2xl font-bold shadow-lg shadow-blue-500/30 hover:shadow-blue-500/50 hover:-translate-y-0.5 active:translate-y-0 active:scale-[0.98] transition-all flex justify-center items-center gap-2">
                        <span>Masuk ke Portal</span> <i class="bi bi-arrow-right"></i>
                    </button>
                </form>
                <p class="text-center text-gray-400 text-xs mt-8 font-medium">Password default: tanggal lahir (ddmmyyyy)
                </p>
            </div>
        </div>

        <!-- Splash Screen -->
        <div id="portal-splash"
            class="hidden min-h-screen flex-col items-center justify-center p-4 bg-gradient-to-br from-blue-600 to-indigo-800 relative z-[100]">
            <div class="w-20 h-20 bg-white rounded-[2rem] flex items-center justify-center mb-6 shadow-2xl splash-logo">
                <i class="bi bi-check-lg text-4xl text-blue-600 splash-icon"></i>
            </div>
            <h2 class="text-xl font-bold text-white mb-2 splash-text">Login Berhasil</h2>
            <p class="text-blue-200 text-xs splash-subtext" id="splash-welcome-text">Menyiapkan dashboard Anda...</p>
        </div>

        <!-- App Container -->
        <div id="portal-app" class="hidden min-h-screen bg-[#f8fafc] dark:bg-obsidian-950 pb-24 relative transition-colors duration-300">

            <!-- Global Header Overlay Elements -->
            <div
                class="fixed top-6 left-1/2 -translate-x-1/2 w-full max-w-[480px] px-6 z-[60] flex justify-end pointer-events-none">
                <button onclick="Portal.toggleNotifications()" id="notif-bell"
                    class="w-10 h-10 bg-white rounded-2xl flex items-center justify-center shadow-lg shadow-gray-200/50 border border-gray-100 relative group transition-all active:scale-95 pointer-events-auto">
                    <i class="bi bi-bell text-gray-700 text-lg group-hover:text-blue-600"></i>
                    <span id="notif-badge"
                        class="hidden absolute -top-1 -right-1 w-4 h-4 bg-rose-500 border-2 border-white rounded-full text-[9px] text-white flex items-center justify-center font-bold"></span>
                </button>
            </div>

            <!-- Notification Overlay -->
            <div id="notif-overlay" class="fixed inset-0 z-[70] hidden">
                <div class="absolute inset-0 bg-black/20 dark:bg-black/40 backdrop-blur-sm" onclick="Portal.toggleNotifications()"></div>
                <div id="notif-panel"
                    class="absolute bottom-0 left-0 right-0 bg-white dark:bg-obsidian-900 rounded-t-[2.5rem] shadow-2xl max-w-[480px] mx-auto transform translate-y-full transition-transform duration-300 ease-out flex flex-col max-h-[85vh]">
                    <div class="px-6 py-6 border-b border-gray-50 dark:border-obsidian-800 flex items-center justify-between">
                        <h3 class="text-xl font-bold text-gray-900 dark:text-obsidian-100">Notifikasi</h3>
                        <button onclick="Portal.toggleNotifications()"
                            class="w-8 h-8 flex items-center justify-center rounded-full bg-gray-50 dark:bg-obsidian-800 text-gray-400 dark:text-obsidian-500 hover:text-gray-900 dark:hover:text-obsidian-100">
                            <i class="bi bi-x-lg text-xs"></i>
                        </button>
                    </div>
                    <div id="notif-list" class="flex-1 overflow-y-auto px-4 py-4 space-y-3 pb-10">
                        <!-- Notifications rendered here -->
                    </div>
                </div>
            </div>

            <!-- Pull to Refresh Spinner -->
            <div class="ptr-container">
                <div id="ptr-spinner"
                    class="ptr-spinner bg-white dark:bg-obsidian-800 shadow-sm flex items-center justify-center text-indigo-600 dark:text-indigo-400 text-lg">
                    <i class="bi bi-arrow-down-short"></i>
                </div>
            </div>

            <!-- PWA Install Banner -->
            <div id="pwa-install-banner"
                class="fixed bottom-[80px] left-4 right-4 bg-gray-900 dark:bg-obsidian-900 border border-gray-700 dark:border-obsidian-800 rounded-2xl p-4 shadow-2xl z-40 text-white max-w-[448px] mx-auto flex items-center justify-between gap-3">
                <div class="flex items-center gap-3">
                    <div
                        class="w-10 h-10 bg-gradient-to-br from-blue-500 to-indigo-600 rounded-xl flex items-center justify-center shrink-0">
                        <i class="bi bi-wallet2 text-white text-lg"></i>
                    </div>
                    <div>
                        <p class="font-bold text-sm leading-tight text-white">Install Portal</p>
                        <p class="text-[10px] text-gray-400 leading-tight mt-0.5">Akses lebih cepat & hemat kuota</p>
                    </div>
                </div>
