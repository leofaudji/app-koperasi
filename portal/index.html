<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#4F46E5">
    <meta name="description" content="Portal Anggota Koperasi Simpan Pinjam">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Portal Anggota">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="icon" type="image/png" href="../assets/images/favicon.png">
    <title>Portal Anggota - Koperasi</title>
    <script src="assets/js/tailwind.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        obsidian: {
                            50: '#f8fafc',
                            100: '#f1f5f9',
                            200: '#e2e8f0',
                            300: '#cbd5e1',
                            400: '#94a3b8',
                            500: '#64748b',
                            600: '#475569',
                            700: '#334155',
                            800: '#1e293b',
                            900: '#0f172a',
                            950: '#020617',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="assets/js/sweetalert2.all.min.js"></script>
    <script>
        // Apply theme immediately to prevent flashing
        if (localStorage.getItem('kop_portal_theme') === 'dark') {
            document.documentElement.classList.add('dark');
        }
    </script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');

        body {
            background-color: #f1f5f9;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
            /* Native App Feel: Disable selection and callouts */
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            /* Prevent bounce scrolling on some browsers */
            overscroll-behavior-y: contain;
            /* Hide scrollbar by default for a clean app-like feel */
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        /* Re-enable selection for inputs */
        input, textarea {
            user-select: text !important;
            -webkit-user-select: text !important;
        }

        body::-webkit-scrollbar,
        .custom-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .custom-scrollbar {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .mobile-container {
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            background: #f8fafc;
            position: relative;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.05);
            overflow-x: hidden;
            /* Safe area for Notch/Home Indicator */
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            /* Hide scrollbar for internal scrolling if any */
            scrollbar-width: none;
            -ms-overflow-style: none;
            transition: background-color 0.3s ease;
        }

        html.dark body {
            background-color: #020617;
        }

        html.dark .mobile-container {
            background-color: #020617;
        }

        .mobile-container::-webkit-scrollbar {
            display: none;
        }

        /* SweetAlert2 Dark Mode Overrides */
        .dark .swal2-popup {
            background: #0f172a !important;
            color: #f1f5f9 !important;
            border: 1px solid #1e293b !important;
            border-radius: 2.5rem !important;
        }

        .dark .swal2-title,
        .dark .swal2-html-container {
            color: #f1f5f9 !important;
        }

        .dark .swal2-input,
        .dark .swal2-textarea {
            background: #020617 !important;
            border-color: #1e293b !important;
            color: #f1f5f9 !important;
        }

        .dark .swal2-confirm {
            background-color: #2563eb !important;
        }

        .dark .swal2-cancel {
            background-color: #1e293b !important;
            color: #94a3b8 !important;
        }

        /* Modern Wallet Card */
        .wallet-card {
            background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%);
            border-radius: 1.5rem;
            padding: 1.5rem;
            color: white;
            position: relative;
            overflow: hidden;
            box-shadow: 0 15px 30px -5px rgba(37, 99, 235, 0.4);
        }

        .wallet-card::after {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 200px;
            height: 200px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            pointer-events: none;
        }

        /* 3D Card Flip */
        .flip-card {
            background-color: transparent;
            width: 100%;
            perspective: 1000px;
            margin-bottom: 1.5rem;
        }

        .flip-card-inner {
            position: relative;
            width: 100%;
            text-align: center;
            transition: transform 0.8s;
            transform-style: preserve-3d;
        }

        .flip-card.flipped .flip-card-inner {
            transform: rotateY(180deg);
        }

        .flip-card-front,
        .flip-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 1.5rem;
        }

        .flip-card-back {
            transform: rotateY(180deg);
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-flip {
            position: absolute;
            bottom: 1rem;
            right: 1rem;
            width: 2.5rem;
            height: 2.5rem;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(4px);
            border-radius: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 20;
            transition: all 0.2s;
        }

        .btn-flip:active {
            transform: scale(0.9);
        }

        .nfc-indicator {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, transparent, #60a5fa, transparent);
            background-size: 200% 100%;
            animation: nfc-pulse 2s infinite linear;
            opacity: 0.6;
            border-radius: 1.5rem 1.5rem 0 0;
        }

        @keyframes nfc-pulse {
            0% {
                background-position: 100% 0;
            }

            100% {
                background-position: -100% 0;
            }
        }

        .nav-item {
            color: #94a3b8;
            transition: all 0.3s ease;
            position: relative;
        }

        .nav-item.active {
            color: #2563eb;
            font-weight: 600;
        }

        .nav-item.active::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 12px;
            height: 3px;
            background: #2563eb;
            border-radius: 10px;
            box-shadow: 0 2px 4px rgba(37, 99, 235, 0.3);
            animation: barExpand 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes barExpand {
            from {
                width: 0;
                opacity: 0;
            }

            to {
                width: 12px;
                opacity: 1;
            }
        }

        @keyframes navPop {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.3);
            }

            100% {
                transform: scale(1.1);
            }
        }

        .nav-item.active i {
            animation: navPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            color: #2563eb;
            filter: drop-shadow(0 0 8px rgba(37, 99, 235, 0.3));
        }

        .nav-item {
            padding: 8px 12px;
            border-radius: 16px;
            transition: all 0.3s ease;
        }

        .nav-item.active {
            background: rgba(37, 99, 235, 0.05);
        }

        html.dark .nav-item.active {
            background: rgba(37, 99, 235, 0.1);
        }

        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .fade-in {
            animation: fadeIn 0.3s ease;
        }

        /* Tab Transition Animation - Native Feel */
        .tab-content {
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .tab-content:not(.hidden) {
            opacity: 1;
            transform: translateX(0) translateY(0);
        }

        .slide-in-right {
            animation: slideInRight 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .slide-in-left {
            animation: slideInLeft 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideInRight {
            0% {
                opacity: 0;
                transform: translateX(30px);
            }

            100% {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes slideInLeft {
            0% {
                opacity: 0;
                transform: translateX(-30px);
            }

            100% {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes tabSlideUp {
            0% {
                opacity: 0;
                transform: translateY(20px) scale(0.98);
            }

            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Skeleton Shimmer Effect */
        .skeleton {
            background: #e2e8f0;
            background: linear-gradient(110deg, #ececec 8%, #f5f5f5 18%, #ececec 33%);
            border-radius: 5px;
            background-size: 200% 100%;
            animation: 1.5s shine linear infinite;
        }

        .dark .skeleton {
            background: #1e293b;
            background: linear-gradient(110deg, #1e293b 8%, #334155 18%, #1e293b 33%);
            background-size: 200% 100%;
        }

        @keyframes shine {
            to {
                background-position-x: -200%;
            }
        }

        /* Initial Splash Screen */
        #initial-splash {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at top right, #3b82f6 0%, #1e40af 100%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: background 1.5s ease-in-out, opacity 0.8s ease-in-out, transform 0.8s ease-in-out;
        }

        /* Dynamic Time-based Backgrounds */
        #initial-splash.bg-morning {
            background: linear-gradient(135deg, #0ea5e9 0%, #2563eb 100%);
        }

        #initial-splash.bg-day {
            background: radial-gradient(circle at top right, #3b82f6 0%, #1e40af 100%);
        }

        #initial-splash.bg-evening {
            background: linear-gradient(135deg, #f97316 0%, #4338ca 100%);
        }

        #initial-splash.bg-night {
            background: radial-gradient(circle at top right, #1e293b 0%, #020617 100%);
        }

        #initial-splash.fade-out {
            opacity: 0;
            visibility: hidden;
            transform: scale(1.1);
        }

        .splash-loader {
            width: 48px;
            height: 48px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: inline-block;
            position: relative;
            box-sizing: border-box;
            animation: rotation 1s linear infinite;
        }

        .splash-loader::after {
            content: '';
            box-sizing: border-box;
            position: absolute;
            left: 0;
            top: 0;
            background: white;
            width: 12px;
            height: 12px;
            transform: translate(-50%, 50%);
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        @keyframes rotation {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .branding-appear {
            animation: brandingSlideUp 1s cubic-bezier(0.23, 1, 0.32, 1) forwards;
        }

        @keyframes brandingSlideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Splash Screen Animations */
        @keyframes popIn {
            0% {
                transform: scale(0.5);
                opacity: 0;
            }

            70% {
                transform: scale(1.1);
                opacity: 1;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes drawCheck {
            0% {
                clip-path: inset(100% 0 0 0);
            }

            100% {
                clip-path: inset(0 0 0 0);
            }
        }

        @keyframes slideUpFade {
            0% {
                transform: translateY(20px);
                opacity: 0;
            }

            100% {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .splash-logo {
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .splash-icon {
            animation: drawCheck 0.5s ease-out 0.4s both;
        }

        .splash-text {
            animation: slideUpFade 0.5s ease-out 0.6s both;
        }

        .splash-subtext {
            animation: slideUpFade 0.5s ease-out 0.8s both;
        }

        /* PWA Install Banner */
        #pwa-install-banner {
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform: translateY(120%);
        }

        #pwa-install-banner.show {
            transform: translateY(0);
        }

        /* Pull to Refresh */
        .ptr-container {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            z-index: 20;
            pointer-events: none;
        }

        .ptr-spinner {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 3px solid #e2e8f0;
            border-top-color: #4F46E5;
            opacity: 0;
            transform: scale(0.5);
            transition: opacity 0.2s, transform 0.2s;
        }

        .ptr-spinner.refreshing {
            animation: ptrSpin 0.8s linear infinite;
            opacity: 1;
            transform: scale(1);
        }

        @keyframes ptrSpin {
            to {
                transform: rotate(360deg) scale(1);
            }
        }

        /* ── Bottom Sheet Modal Animations ── */
        .modal-sheet-overlay {
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal-sheet-overlay.open {
            opacity: 1;
        }

        .modal-sheet-panel {
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .modal-sheet-panel.open {
            transform: translateY(0);
        }

        /* Wrapper hidden until shown */
        .modal-sheet-wrapper {
            visibility: hidden;
        }

        .modal-sheet-wrapper.visible {
            visibility: visible;
        }

        /* Prevent Mobile Zoom on Input Focus */
        input,
        textarea,
        select {
            font-size: 16px !important;
        }

        html {
            touch-action: manipulation;
        }
    </style>

    <!-- Prevent Viewport Zoom on Input Focus -->
    <script>
        document.addEventListener('touchmove', function (event) {
            if (event.scale !== 1) {
                event.preventDefault();
            }
        }, { passive: false });
    </script>
</head>

<body class="overflow-hidden">
    <!-- Initial Professional Splash Screen -->
    <div id="initial-splash">
        <div class="flex flex-col items-center branding-appear">
            <div class="w-32 h-32 mb-8 relative">
                <div
                    class="absolute inset-0 bg-white/10 backdrop-blur-xl rounded-[2.5rem] rotate-6 scale-90 opacity-50">
                </div>
                <div
                    class="absolute inset-0 bg-white/20 backdrop-blur-xl rounded-[2.5rem] -rotate-3 scale-95 opacity-80">
                </div>
                <div
                    class="relative w-full h-full bg-white rounded-[2.5rem] shadow-2xl flex items-center justify-center overflow-hidden border border-white/50">
                    <img id="splash-logo-img" src="{{LOGO_URL}}"
                        class="w-20 h-20 object-contain p-2 transition-transform duration-700 hover:scale-110"
                        onerror="this.onerror=null; this.src='../assets/images/favicon.png';">
                </div>
            </div>

            <div class="text-center">
                <h1 class="text-3xl font-bold text-white tracking-tight mb-2">{{PWA_NAME}}</h1>
                <div class="flex items-center justify-center gap-3">
                    <span class="w-12 h-[1px] bg-white/20"></span>
                    <span class="text-white/60 text-[10px] uppercase tracking-[0.2em] font-medium">Digital Portal</span>
                    <span class="w-12 h-[1px] bg-white/20"></span>
                </div>
            </div>
        </div>

        <div class="absolute bottom-24 flex flex-col items-center gap-4">
            <span class="splash-loader"></span>
            <p id="splash-loader-text" class="text-white/40 text-[9px] uppercase tracking-widest animate-pulse">
                Initializing System...</p>
        </div>

        <!-- Financial Wisdom/Tips -->
        <div class="absolute bottom-12 px-10 text-center branding-appear" style="animation-delay: 0.5s">
            <p id="splash-tip" class="text-white/30 text-[10px] leading-relaxed italic font-medium max-w-[280px]"></p>
        </div>
    </div>

    <div class="mobile-container">
        <!-- Login -->
        <div id="portal-login"
            class="min-h-screen flex flex-col items-center justify-center p-6 bg-[#F8FAFC] dark:bg-[#0B1120] relative overflow-hidden transition-colors duration-500 font-sans">

            <!-- Minimal Geometric Background Elements (Standard Fintech) -->
            <div class="absolute inset-0 overflow-hidden pointer-events-none flex justify-center items-center">
                <!-- Soft top glow (Replaced blur with radial gradient for Safari performance) -->
                <div
                    class="absolute -top-[20%] left-1/2 -translate-x-1/2 w-[800px] h-[600px] bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-blue-500/10 to-transparent dark:from-blue-500/20 dark:to-transparent rounded-[100%]">
                </div>
                <!-- Grid pattern for structure -->
                <div
                    class="absolute inset-0 bg-[linear-gradient(to_right,#8080800a_1px,transparent_1px),linear-gradient(to_bottom,#8080800a_1px,transparent_1px)] dark:bg-[linear-gradient(to_right,#ffffff05_1px,transparent_1px),linear-gradient(to_bottom,#ffffff05_1px,transparent_1px)] bg-[size:24px_24px]">
                </div>
            </div>

            <!-- Main Container -->
            <div class="w-full max-w-[400px] relative z-10 flex flex-col items-center">

                <!-- Corporate Fintech Branding -->
                <div class="mb-8 text-center flex flex-col items-center w-full">
                    <div
                        class="w-16 h-16 bg-blue-600 dark:bg-blue-500 rounded-[18px] flex items-center justify-center mb-6 shadow-lg shadow-blue-600/20">
                        <i class="bi bi-shield-check text-white text-3xl"></i>
                    </div>
                    <h1 class="text-[28px] font-bold text-slate-900 dark:text-white tracking-tight mb-2">{{PWA_NAME}}
                    </h1>
                    <p class="text-[14px] text-slate-500 dark:text-slate-400 font-medium">Portal Keuangan Digital
                        Anggota</p>
                </div>

                <!-- Form Card -->
                <div
                    class="w-full bg-white dark:bg-[#1E293B] rounded-2xl p-8 shadow-[0_4px_24px_rgba(0,0,0,0.04)] dark:shadow-none border border-slate-200/60 dark:border-slate-700/50 relative">

                    <form id="p-login-form" class="space-y-5">

                        <!-- Error Alert -->
                        <div id="p-login-error"
                            class="hidden bg-red-50 dark:bg-red-500/10 border border-red-200 dark:border-red-500/20 text-red-600 dark:text-red-400 p-3 text-[13px] flex items-start gap-2.5 rounded-lg transition-all">
                            <i class="bi bi-exclamation-circle-fill mt-0.5"></i>
                            <span id="p-login-error-msg" class="font-medium"></span>
                        </div>

                        <!-- ID Input -->
                        <div class="space-y-1.5 group">
                            <label class="block text-[13px] font-semibold text-slate-700 dark:text-slate-300">Nomor Anggota</label>
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                                    <i class="bi bi-person text-slate-400 dark:text-slate-500 text-[18px] group-focus-within:text-blue-600 dark:group-focus-within:text-blue-500 transition-colors"></i>
                                </div>
                                <input type="tel" inputmode="numeric" pattern="[0-9]*" id="p-no-anggota"
                                    class="w-full bg-white dark:bg-[#0F172A] border border-slate-300 dark:border-slate-600 rounded-xl pl-10 pr-4 py-3 text-[15px] font-medium text-slate-900 dark:text-white placeholder-slate-400 focus:border-blue-600 dark:focus:border-blue-500 focus:ring-4 focus:ring-blue-600/10 dark:focus:ring-blue-500/10 outline-none transition-colors duration-200"
                                    placeholder="Contoh: 0001" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" required
                                    oninput="this.value = this.value.replace(/[^0-9]/g, '')">
                            </div>
                        </div>

                        <!-- Password Input -->
                        <div class="space-y-1.5 group">
                            <div class="flex justify-between items-center">
                                <label class="block text-[13px] font-semibold text-slate-700 dark:text-slate-300">Kata Sandi</label>
                            </div>
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                                    <i class="bi bi-shield-lock text-slate-400 dark:text-slate-500 text-[18px] group-focus-within:text-blue-600 dark:group-focus-within:text-blue-500 transition-colors"></i>
                                </div>
                                <input type="password" id="p-password" inputmode="numeric" pattern="[0-9]*"
                                    class="w-full bg-white dark:bg-[#0F172A] border border-slate-300 dark:border-slate-600 rounded-xl pl-10 pr-4 py-3 text-[15px] font-medium text-slate-900 dark:text-white placeholder-slate-400 focus:border-blue-600 dark:focus:border-blue-500 focus:ring-4 focus:ring-blue-600/10 dark:focus:ring-blue-500/10 outline-none transition-colors duration-200"
                                    placeholder="••••••••" autocomplete="current-password" required
                                    oninput="this.value = this.value.replace(/[^0-9]/g, '')">
                            </div>
                        </div>

                        <!-- Action Button -->
                        <button type="submit" id="p-login-btn"
                            class="w-full bg-blue-600 hover:bg-blue-700 dark:bg-blue-600 dark:hover:bg-blue-500 text-white py-3.5 rounded-xl font-semibold text-[15px] transition-colors duration-200 mt-2 shadow-sm flex justify-center items-center gap-2">
                            <span>Masuk ke Portal</span>
                        </button>
                    </form>
                </div>

                <!-- Footer Text -->
                <div class="mt-8 text-center flex flex-col items-center gap-3">
                    <p class="text-[13px] text-slate-500 dark:text-slate-400">
                        Default sandi: <span
                            class="font-semibold text-slate-700 dark:text-slate-300 bg-slate-200/50 dark:bg-slate-800 px-2 py-1 rounded">DDMMYYYY</span>
                    </p>
                    <div
                        class="flex items-center justify-center gap-1.5 text-[11px] text-slate-400 dark:text-slate-500 font-medium mt-2">
                        <i class="bi bi-lock-fill"></i>
                        <span>Dilindungi oleh Enkripsi Bank-Grade 256-bit</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Splash Screen -->
        <div id="portal-splash"
            class="hidden min-h-screen flex-col items-center justify-center p-4 bg-gradient-to-br from-blue-600 to-indigo-800 relative z-[100]">
            <div class="w-20 h-20 bg-white rounded-[2rem] flex items-center justify-center mb-6 shadow-2xl splash-logo">
                <i class="bi bi-check-lg text-4xl text-blue-600 splash-icon"></i>
            </div>
            <h2 class="text-xl font-bold text-white mb-2 splash-text">Login Berhasil</h2>
            <p class="text-blue-200 text-xs splash-subtext" id="splash-welcome-text">Menyiapkan dashboard Anda...</p>
        </div>

        <!-- App Container -->
        <div id="portal-app"
            class="hidden min-h-screen bg-[#f8fafc] dark:bg-obsidian-950 pb-24 relative transition-colors duration-300">

            <!-- Global Header Overlay Elements -->
            <div class="fixed top-0 left-1/2 -translate-x-1/2 w-full max-w-[480px] px-6 py-6 z-[60] flex justify-end pointer-events-none">
                <button onclick="Portal.toggleNotifications()" id="notif-bell"
                    class="w-10 h-10 bg-white/90 dark:bg-obsidian-900/90 backdrop-blur-md rounded-2xl flex items-center justify-center shadow-lg shadow-gray-200/50 dark:shadow-none border border-gray-100 dark:border-obsidian-800 relative group transition-all active:scale-95 pointer-events-auto">
                    <i class="bi bi-bell text-gray-700 dark:text-obsidian-200 text-lg group-hover:text-blue-600"></i>
                    <span id="notif-badge"
                        class="hidden absolute -top-1 -right-1 w-4 h-4 bg-rose-500 border-2 border-white dark:border-obsidian-900 rounded-full text-[9px] text-white flex items-center justify-center font-bold"></span>
                </button>
            </div>

            <!-- Notification Overlay -->
            <div id="notif-overlay" class="fixed inset-0 z-[70] hidden">
                <div class="absolute inset-0 bg-black/20 dark:bg-black/40 backdrop-blur-sm"
                    onclick="Portal.toggleNotifications()"></div>
                <div id="notif-panel"
                    class="absolute bottom-0 left-0 right-0 bg-white dark:bg-obsidian-900 rounded-t-[2.5rem] shadow-2xl max-w-[480px] mx-auto transform translate-y-full transition-transform duration-300 ease-out flex flex-col max-h-[85vh]">
                    <div
                        class="px-6 py-6 border-b border-gray-50 dark:border-obsidian-800 flex items-center justify-between">
                        <h3 class="text-xl font-bold text-gray-900 dark:text-obsidian-100">Notifikasi</h3>
                        <button onclick="Portal.toggleNotifications()"
                            class="w-8 h-8 flex items-center justify-center rounded-full bg-gray-50 dark:bg-obsidian-800 text-gray-400 dark:text-obsidian-500 hover:text-gray-900 dark:hover:text-obsidian-100">
                            <i class="bi bi-x-lg text-xs"></i>
                        </button>
                    </div>
                    <div id="notif-list" class="flex-1 overflow-y-auto px-4 py-4 space-y-3 pb-10">
                        <!-- Notifications rendered here -->
                    </div>
                </div>
            </div>

            <!-- Pull to Refresh Spinner -->
            <div class="ptr-container">
                <div id="ptr-spinner"
                    class="ptr-spinner bg-white dark:bg-obsidian-800 shadow-sm flex items-center justify-center text-indigo-600 dark:text-indigo-400 text-lg">
                    <i class="bi bi-arrow-down-short"></i>
                </div>
            </div>

            <!-- PWA Install Banner -->
            <div id="pwa-install-banner"
                class="fixed bottom-[80px] left-4 right-4 bg-gray-900 dark:bg-obsidian-900 border border-gray-700 dark:border-obsidian-800 rounded-2xl p-4 shadow-2xl z-40 text-white max-w-[448px] mx-auto flex items-center justify-between gap-3">
                <div class="flex items-center gap-3">
                    <div
                        class="w-10 h-10 bg-gradient-to-br from-blue-500 to-indigo-600 rounded-xl flex items-center justify-center shrink-0">
                        <i class="bi bi-wallet2 text-white text-lg"></i>
                    </div>
                    <div>
                        <p class="font-bold text-sm leading-tight text-white">Install Portal</p>
                        <p class="text-[10px] text-gray-400 leading-tight mt-0.5">Akses lebih cepat & hemat kuota</p>
                    </div>
                </div>
                <div class="flex gap-2">
                    <button id="pwa-install-dismiss"
                        class="w-8 h-8 flex items-center justify-center rounded-full bg-gray-800 dark:bg-obsidian-700 text-gray-400 hover:text-white transition-colors">
                        <i class="bi bi-x-lg text-xs"></i>
                    </button>
                    <button id="pwa-install-btn"
                        class="bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold px-4 py-2 rounded-xl transition-colors shadow-lg shadow-blue-500/20">
                        Install
                    </button>
                </div>
            </div>

            <!-- Tab Content Containers -->
            <div id="tab-content-home" class="tab-content"></div>
            <div id="tab-content-simpanan" class="tab-content hidden"></div>
            <div id="tab-content-pinjaman" class="tab-content hidden"></div>
            <div id="tab-content-profil" class="tab-content hidden"></div>
            <div id="tab-content-pengajuan_pinjaman" class="tab-content hidden"></div>
            <div id="tab-content-laporan" class="tab-content hidden"></div>
            <div id="tab-content-rat" class="tab-content hidden"></div>

            <!-- Bottom Nav -->
            <div
                class="fixed bottom-0 left-0 right-0 bg-white/95 dark:bg-obsidian-950/95 backdrop-blur-md border-t border-gray-100 dark:border-obsidian-800 px-6 py-3 flex justify-between items-center max-w-[480px] mx-auto z-50 shadow-[0_-10px_20px_rgba(0,0,0,0.02)] transition-colors duration-300">
                <button onclick="Portal.tab('home', true)" id="tab-home" class="nav-item flex flex-col items-center gap-1">
                    <i class="bi bi-grid text-xl mb-0.5"></i>
                    <span class="text-[10px] font-medium">Home</span>
                </button>
                <button onclick="Portal.tab('simpanan', true)" id="tab-simpanan"
                    class="nav-item flex flex-col items-center gap-1">
                    <i class="bi bi-piggy-bank text-xl mb-0.5"></i>
                    <span class="text-[10px] font-medium">Simpanan</span>
                </button>
                <button onclick="Portal.tab('pinjaman', true)" id="tab-pinjaman"
                    class="nav-item flex flex-col items-center gap-1">
                    <i class="bi bi-credit-card-2-front text-xl mb-0.5"></i>
                    <span class="text-[10px] font-medium">Pinjaman</span>
                </button>
                <button onclick="Portal.tab('rat', true)" id="tab-rat" class="nav-item flex flex-col items-center gap-1">
                    <i class="bi bi-megaphone text-xl mb-0.5"></i>
                    <span class="text-[10px] font-medium">RAT</span>
                </button>
                <button onclick="Portal.tab('profil', true)" id="tab-profil"
                    class="nav-item flex flex-col items-center gap-1">
                    <i class="bi bi-person text-xl mb-0.5"></i>
                    <span class="text-[10px] font-medium">Profil</span>
                </button>
            </div>
        </div>
    </div>

    <script>window.PORTAL_VERSION = '{{VERSION}}';</script>
    <script src="assets/js/portal.js?v={{VERSION}}"></script>

</body>

</html>
